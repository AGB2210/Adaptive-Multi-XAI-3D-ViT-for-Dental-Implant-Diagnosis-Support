# Runs on every push and pull request. Four gates, cheapest first, so a typo
# fails in seconds rather than after the test suite.
#
# Action versions are held at the current major. GitHub is retiring the Node 20
# runtime, and an action pinned to a major that still declares node20 is forced
# onto node24 with a deprecation warning until it eventually stops running at
# all. Bump these together when the next major lands rather than waiting for the
# warning to become a failure.
#
# The suite needs no data and no GPU by design — it runs against synthetic
# volumes — so CI verifies the whole pipeline without downloading any cohort.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 3.11 is the verified set in requirements.txt; 3.12 is what the team runs
    # locally. A rented GPU box gives you whichever its image ships, so both
    # have to stay green or the handoff breaks on someone else's machine.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: CI has no GPU, and the CUDA wheel is ~2.5 GB.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # Pinned: the lint rules are pinned in pyproject for a reason, and an
          # unpinned linter reintroduces exactly the drift that pinning prevents.
          pip install 'ruff==0.16.4'

      - name: Version is the single source of truth
        run: python scripts/version.py --check

      - name: Every module imports
        # Catches syntax errors and broken imports in code the tests do not
        # reach - a script that only fails when someone runs it on a GPU box
        # is a script that fails in front of the user.
        run: python scripts/check_imports.py

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Every config resolves
        # `train.out_dir` once inherited from default.yaml and dropped site
        # checkpoints into the superseded detection task's directory. Nothing
        # crashed; the run simply went to the wrong place. Loading each config
        # and checking its paths agree is the cheapest guard against that class.
        run: |
          python - <<'EOF'
          from pathlib import Path
          from src.utils.config import load_config
          for p in sorted(Path("configs").glob("*.yaml")):
              cfg = load_config(str(p))
              art, out = str(cfg.data.artifacts_dir), str(cfg.train.out_dir)
              assert out.startswith(art), f"{p.name}: out_dir {out} escapes artifacts_dir {art}"
              print(f"{p.name:24} artifacts={art:24} out={out}")
          EOF

      - name: Training runs end to end on synthetic data
        # Needs no cohort and no GPU. It exercises the seam that unit tests
        # cannot: config -> loaders -> model -> loss -> metrics -> checkpoint.
        # The synthetic gate once hard-coded six labels and broke the moment a
        # two-output task was configured, and every unit test still passed.
        run: |
          python scripts/train.py --config configs/sites_smoke.yaml --synthetic
          python - <<'EOF'
          import json
          from src.data.taskdef import all_target_names, label_names_for, regression_names_for
          from src.utils.config import load_config
          cfg = load_config("configs/sites_smoke.yaml")
          m = json.load(open("artifacts_sites/runs/vit3d_synthetic/metrics.json"))
          want = all_target_names(cfg)
          assert m["labels"] == want, f"trained {m['labels']}, config says {want}"
          assert m["n_params"] > 0
          # metrics.json is nested by unit: binary heads carry AUROC and a
          # threshold, millimetre heads carry MAE against a floor. Asserting one
          # flat per_label block over both would pass only while the task stayed
          # pure classification.
          val = m["val"]
          binary, mm = label_names_for(cfg), regression_names_for(cfg)
          if binary:
              assert set(val["classification"]["per_label"]) == set(binary)
          if mm:
              assert set(val["regression"]) == set(mm)
              for name, r in val["regression"].items():
                  assert "mae" in r and "mae_floor" in r, f"{name} has no floor to read against"
              assert val["threshold_sensitivity"], "the threshold sweep was not produced"
          print(f"ok: {len(binary)} binary + {len(mm)} millimetre heads, "
                f"{m['n_params']:,} parameters")
          EOF

# Runs on every push and pull request. Four gates, cheapest first, so a typo
# fails in seconds rather than after the test suite.
#
# Action versions are held at the current major. GitHub is retiring the Node 20
# runtime, and an action pinned to a major that still declares node20 is forced
# onto node24 with a deprecation warning until it eventually stops running at
# all. Bump these together when the next major lands rather than waiting for the
# warning to become a failure.
#
# The suite needs no data and no GPU by design — it runs against synthetic
# volumes — so CI verifies the whole pipeline without downloading any cohort.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 3.11 is the verified set in requirements.txt; 3.12 is what the team runs
    # locally. A rented GPU box gives you whichever its image ships, so both
    # have to stay green or the handoff breaks on someone else's machine.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: CI has no GPU, and the CUDA wheel is ~2.5 GB.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # Pinned: the lint rules are pinned in pyproject for a reason, and an
          # unpinned linter reintroduces exactly the drift that pinning prevents.
          pip install 'ruff==0.16.4'

      - name: Version is the single source of truth
        run: python scripts/version.py --check

      - name: Every module imports
        # Catches syntax errors and broken imports in code the tests do not
        # reach - a script that only fails when someone runs it on a GPU box
        # is a script that fails in front of the user.
        run: python scripts/check_imports.py

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Every config resolves
        # `train.out_dir` once inherited from default.yaml and dropped site
        # checkpoints into the superseded detection task's directory. Nothing
        # crashed; the run simply went to the wrong place. Loading each config
        # and checking its paths agree is the cheapest guard against that class.
        run: |
          python - <<'EOF'
          from pathlib import Path
          from src.utils.config import load_config
          for p in sorted(Path("configs").glob("*.yaml")):
              cfg = load_config(str(p))
              art, out = str(cfg.data.artifacts_dir), str(cfg.train.out_dir)
              assert out.startswith(art), f"{p.name}: out_dir {out} escapes artifacts_dir {art}"
              print(f"{p.name:24} artifacts={art:24} out={out}")
          EOF

      - name: Training runs end to end on synthetic data
        # Needs no cohort and no GPU. It exercises the seam that unit tests
        # cannot: config -> loaders -> model -> loss -> metrics -> checkpoint.
        # The synthetic gate once hard-coded six labels and broke the moment a
        # two-output task was configured, and every unit test still passed.
        run: |
          python scripts/train.py --config configs/sites_smoke.yaml --synthetic
          python - <<'EOF'
          import json
          from src.data.taskdef import all_target_names, label_names_for, regression_names_for
          from src.utils.config import load_config
          cfg = load_config("configs/sites_smoke.yaml")
          m = json.load(open("artifacts_sites/runs/vit3d_synthetic/metrics.json"))
          want = all_target_names(cfg)
          assert m["labels"] == want, f"trained {m['labels']}, config says {want}"
          assert m["n_params"] > 0
          # metrics.json is nested by unit: binary heads carry AUROC and a
          # threshold, millimetre heads carry MAE against a floor. Asserting one
          # flat per_label block over both would pass only while the task stayed
          # pure classification.
          val = m["val"]
          binary, mm = label_names_for(cfg), regression_names_for(cfg)
          if binary:
              assert set(val["classification"]["per_label"]) == set(binary)
          if mm:
              assert set(val["regression"]) == set(mm)
              # A VALUE check, not just a shape check. The bug that shipped --
              # the loss comparing raw millimetres to standardised outputs --
              # produced an MAE of 53.5 mm on a target whose whole range was
              # 17-26 mm, and a gate that only asserted these keys EXIST would
              # have passed it. So would sigmoided millimetres squashed to
              # (0, 1).
              #
              # The bound is deliberately loose, and 3.0 is measured rather
              # than guessed. One epoch on 32^3 synthetic volumes does not
              # converge, so this cannot assert MAE < floor without flaking,
              # and a flaky gate is worse than none. Across seeds 1337, 7 and
              # 42 at one epoch the ratio ran 1.03x to 1.96x. A broken
              # transform lands at 4.7x or higher on this data, because the
              # targets centre at 18 mm and 10 mm against floors of 2.6 and
              # 1.9. 3.0 sits between the two with margin on both sides.
              for name, r in val["regression"].items():
                  assert "mae" in r and "mae_floor" in r, f"{name} has no floor to read against"
                  ratio = r["mae"] / r["mae_floor"]
                  print(f"   {name:22} MAE {r['mae']:.3f} = {ratio:.2f}x floor {r['mae_floor']:.3f}")
                  assert ratio < 3.0, (
                      f"{name}: MAE {r['mae']:.3f} is {ratio:.1f}x its floor "
                      f"{r['mae_floor']:.3f}. One epoch does not converge, but it "
                      f"does not miss by this much either -- suspect the "
                      f"standardisation direction or a squashed output, not "
                      f"undertraining"
                  )
              assert val["threshold_sensitivity"], "the threshold sweep was not produced"
          print(f"ok: {len(binary)} binary + {len(mm)} millimetre heads, "
                f"{m['n_params']:,} parameters")
          EOF

      - name: Reported predictions come back in millimetres, not in (0, 1)
        # The pooled metrics, the calibration fit and the figure captions all
        # read model outputs, and three separate scripts converted them with a
        # bare `sigmoid` across the whole row. On a millimetre head that maps
        # 18 mm to 0.9999 and scores it against a truth of 18, so the pooled
        # MAE reported roughly the mean of the target. Nothing crashed and no
        # unit test failed. This asserts on a REAL checkpoint that the scaler
        # travelled and that reporting inverts it.
        run: |
          python - <<'EOF'
          import numpy as np, torch
          from src.train.targets import TargetSpec, to_report_units
          ck = torch.load("artifacts_sites/runs/vit3d_synthetic/best.pt",
                          map_location="cpu", weights_only=False)
          spec = TargetSpec.from_state(ck.get("target_spec"))
          assert spec.is_hybrid, "smoke config declares millimetre heads; checkpoint carries no scaler"
          assert spec.mean is not None and spec.std is not None, "no standardiser in the checkpoint"

          rep = to_report_units(np.zeros((1, spec.n_outputs), dtype=np.float32), spec)
          print(f"   binary  {spec.binary[0]:22} at logit 0 -> {rep[0, 0]:.4f}")
          assert abs(rep[0, 0] - 0.5) < 1e-6, "the binary head is not being read as a probability"
          for i, name in enumerate(spec.millimetres):
              value, mean = float(rep[0, len(spec.binary) + i]), float(spec.mean[i])
              print(f"   mm      {name:22} at standardised 0 -> {value:.3f} mm (train mean {mean:.3f})")
              assert abs(value - mean) < 1e-3, f"{name} did not invert to its training mean"
              assert value > 1.0, (
                  f"{name} reports {value:.4f}, inside (0, 1) -- a millimetre head has "
                  f"been sigmoided, which is the fault this gate exists to catch"
              )
          print("ok: binary heads read as probabilities, millimetre heads read as millimetres")
          EOF

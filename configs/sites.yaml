extends: default.yaml

# ===========================================================================
# Per-site implant need and feasibility, at native resolution.
#
# This config is written for a rented datacentre GPU and deliberately carries
# NONE of the compromises that a 4 GB laptop forced on configs/default.yaml.
# Every value below is set by what the task needs, not by what fitted locally.
# If you run it on a small card it will run out of memory -- lower batch_size
# and raise accum_steps to compensate, and change nothing else.
# ===========================================================================

data:
  cache_dir: artifacts_sites/cache
  artifacts_dir: artifacts_sites

task:
  # ONE binary head, TWO millimetre heads.
  #
  # `feasible` is not an observation. It is a rule applied to two measurements:
  #     feasible = available_height_mm >= 12.0 and ridge_width_mm >= 6.0
  # Training on it compiles 12.0 into the weights, and that threshold is the
  # largest single lever in the project. Over the 709 mandibular teeth-tier
  # sites that need an implant:
  #     height rule 10 mm -> 266 infeasible (37.5%)
  #     height rule 12 mm -> 390 infeasible (55.0%)
  #     height rule 14 mm -> 503 infeasible (70.9%)
  # A 2 mm revision moves a third of the answers. As a classifier that costs
  # five folds of retraining; predicting millimetres it costs a re-score, and
  # the sensitivity sweep above becomes a reportable result rather than a risk.
  #
  # `needs_implant` stays binary because it is occupancy -- is this socket empty
  # -- with no millimetre quantity underneath it. Expect it to be easy: "is
  # there a tooth in this patch" is a simple visual task, so a high AUROC there
  # is a sanity check, not a finding.
  labels: [needs_implant]
  targets_mm: [available_height_mm, ridge_width_mm]
  # Relative weight of the millimetre block against BCE. 1.0 with standardised
  # targets puts them on comparable footing; raise it if the binary head, which
  # is the easier task, starts dominating.
  mm_weight: 1.0
  sites_csv: sites_toothfairy3.csv
  # Which site-localisation tiers to train on. "teeth" alone is the accurate
  # subset (leave-one-out median error 1.9 mm); adding the weaker tiers brings
  # in the edentulous patients, who are 30.7% of missing sites and the ones who
  # most need implants. Start strict, then measure what the weaker tiers cost.
  site_methods: [teeth]
  # MANDIBLE ONLY, and this is measured rather than preferred. Of the sites that
  # need an implant, 91.8% are measurable in the mandible and 4.3% in the
  # maxilla: after an upper tooth is lost the ridge resorbs, the sinus
  # pneumatises, and ToothFairy3's UpperJaw mask does not cover the remnant, so
  # 98% of those sites have no bone voxels at all. Training on them would teach
  # the model to reproduce an annotation gap as a clinical verdict.
  #
  # Nothing important is lost. The inferior alveolar canal is annotated in every
  # scan, and nerve clearance limits 408 of the 478 infeasible mandibular sites
  # -- which is precisely the question an explanation should be able to answer.
  site_jaws: [lower]

preprocess:
  # NATIVE RESOLUTION. ToothFairy3 ships at 0.3 mm isotropic and nothing here
  # resamples it. The inferior alveolar canal is 2-3 mm across: at the 1.0 mm
  # used previously that is two or three voxels, and no attribution method can
  # point at a structure it cannot resolve.
  target_spacing: null
  # Cache whole scans cropped to the jaw; patches are cut in the data loader.
  # Storing 28 patches per scan instead would triple the disk for no new data.
  cache_mode: native_volume
  out_shape: null
  fit_mode: none

model:
  # 96 voxels at 0.3 mm = 28.8 mm, more than a tooth site needs, and SMALLER
  # than the 128^3 volumes trained before.
  img_size: 96
  # MIND THE CONV STEM. It has stride 2, so a token covers 2 * patch_size input
  # voxels, not patch_size. This was got wrong once: patch_size 8 was documented
  # as 2.4 mm per token and measured at 4.8 mm, which is WIDER than the 2-3 mm
  # nerve canal the explanations have to resolve -- the exact failure the design
  # was meant to avoid.
  #
  #   patch 8 -> stem 96/2=48, 48/8 =  6^3 =  216 tokens @ 4.8 mm   too coarse
  #   patch 4 -> stem 96/2=48, 48/4 = 12^3 = 1728 tokens @ 2.4 mm   <- this
  #
  # Costs ~4.7x the forward pass and actually has fewer parameters, because the
  # patch-embedding convolution shrinks. Verify with model.grid_size rather than
  # by arithmetic; scripts/run_xai.py prints it from the checkpoint.
  patch_size: 4
  # ONE binary head plus TWO millimetre heads. This counts the whole head; the
  # binary block alone would silently drop the regression outputs.
  num_classes: 3

train:
  # Checkpoints live beside this task's other artifacts. Inheriting
  # artifacts/runs from default.yaml would drop site checkpoints into the
  # superseded detection task's run directory, where a later --checkpoint would
  # silently pick up the wrong model.
  out_dir: artifacts_sites/runs
  # Sized for a 24 GB card. 96^3 patches are 1/19th the voxels of 256^3, so this
  # fits comfortably; it is the batch the task wants, not the batch that fit on
  # a laptop.
  batch_size: 64
  accum_steps: 1
  # Linear scaling from the measured-good 3.0e-5 at effective batch 4.
  lr: 4.8e-4
  epochs: 60
  # ~14,900 site samples against 532 whole scans previously: 28x the data, so
  # fewer epochs cover far more gradient steps.
  early_stop_patience: 12

  # Splits are BY PATIENT. Twenty-eight sites from one scan share anatomy, field
  # of view and annotator; splitting sites at random puts a patient's left
  # molars in train and their right molars in test, which reads as
  # generalisation and is not.
  group_by: patient_id

augment:
  # THIS BLOCK EXISTS TO TURN TWO INHERITED AUGMENTATIONS OFF.
  #
  # flip_lr: default.yaml was written for the 128^3 cache, which was reoriented
  # to RAS+ by nib.as_closest_canonical, so axis 0 was reliably left-right and a
  # sagittal mirror was anatomically sane. The site cache deliberately does NOT
  # reorient -- it keeps the label's own frame and applies only a z flip -- so
  # axis 0 is whatever the scan stored. On any scan where that is
  # anterior-posterior, `vol[::-1]` is an A-P mirror: anatomy that cannot occur
  # in a patient, with the mental foramen on the wrong side. The augmentation
  # docstring forbids exactly this. Off until the axis is read per scan from the
  # affine and recorded in the cache manifest.
  flip_lr_prob: 0.0
  # rotate: ndimage.rotate(order=1) resamples with linear interpolation, which
  # blurs the native 0.3 mm detail that is the entire reason this task runs at
  # native resolution and pays 26.4 GB of cache for it. At rotate_prob 0.5 that
  # was half of every batch. Small rotations are also the slowest thing in the
  # loader, which makes the CPU the bottleneck rather than the GPU.
  rotate_deg: 0.0
  rotate_prob: 0.0
  # Kept: translation and intensity. Translation is what stops the model keying
  # on absolute position within the patch, which matters more here than it did
  # on whole heads, because every patch is cut to the same anatomy by
  # construction.

xai:
  # Sample sizes set by what makes a claim, not by what finished overnight on a
  # laptop. The previous run had to cut every one of these.
  faithfulness_cases: 200
  localization_cases: 200
  adaptive_cases: 200
  randomization_cases: 30
  # GradientSHAP at 24 samples measured a relative standard error of 0.5689 --
  # the estimate had not converged and its numbers were not quotable.
  shap_samples: 200
  ig_steps: 256
